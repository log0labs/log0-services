- id: bug-07-unwrap-none
  title: Rust unwrap() on an unstocked product
  bug_id: 7
  fixture: bug-07-unwrap-none
  service: inventory
  repo_ref: isolated/bug-07-unwrap-none
  expected:
    categories:
    - code_bug
    cause_files:
    - services/inventory/src/main.rs
    cause_symbol: reserve
    trace_files:
    - services/inventory/src/main.rs
    keywords:
    - - unwrap
      - None
    - - sku
      - stock
      - unstocked
      - not stocked
      - missing
      - catalog
    fix_checks:
    - removed: unwrap\(\)
    reference: The single-line fast path unwraps the stock lookup, which is None for catalog products that were never stocked,
      so reserving one panics the request.
    reference_fix:
    - file: services/inventory/src/main.rs
      old: |
        async fn reserve(State(state): State<Arc<AppState>>, Json(req): Json<ReserveRequest>) -> (StatusCode, Json<Value>) {
            // fast path: a single-line order can be refused without building the general reservation
            if let [only] = req.lines.as_slice() {
                let have = state.stock.lock().await.available(&only.sku).unwrap();
                if have < only.qty {
                    return (StatusCode::CONFLICT, Json(json!({"error": "out of stock", "sku": only.sku})));
                }
            }
      new: |
        async fn reserve(State(state): State<Arc<AppState>>, Json(req): Json<ReserveRequest>) -> (StatusCode, Json<Value>) {
- id: bug-08-lock-across-audit
  title: Inventory serialised by a lock held across the audit write
  bug_id: 8
  fixture: bug-08-lock-across-audit
  service: inventory
  repo_ref: isolated/bug-08-lock-across-audit
  expected:
    categories:
    - dependency
    - resource
    - code_bug
    cause_files:
    - services/inventory/src/main.rs
    cause_symbol: reserve
    trace_files: []
    keywords:
    - - lock
      - mutex
    - - audit
    fix_checks:
    - removed: write_audit
      added: write_audit
    reference: The 40 ms audit write now happens while holding the global stock lock, so reservations are serialised and the
      storefront's 2 second inventory timeout expires under a burst.
    reference_fix:
    - file: services/inventory/src/main.rs
      old: |2
            let result = {
                let mut stock = state.stock.lock().await;
                let result = stock.reserve(&req.order_id, &req.lines);
                if result.is_ok() {
                    write_audit(&req.order_id, req.lines.len()).await; // keep audit entries in the same order as the stock changes
                }
                result
            };
            match result {
                Ok(()) => (StatusCode::OK, Json(json!({"reserved": true}))),
      new: |2
            let result = {
                let mut stock = state.stock.lock().await;
                stock.reserve(&req.order_id, &req.lines)
            };
            match result {
                Ok(()) => {
                    write_audit(&req.order_id, req.lines.len()).await;
                    (StatusCode::OK, Json(json!({"reserved": true})))
                }

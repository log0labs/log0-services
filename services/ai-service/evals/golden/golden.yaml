# The golden dataset. Generated by `python -m evals.make_golden`; reviewed by hand. See evals/cases.py.
cases:
- id: bug-01-pool-exhausted
  title: MongoDB pool exhausted under load
  bug_id: 1
  fixture: bug-01-pool-exhausted
  service: storefront-api
  repo_ref: isolated/bug-01-pool-exhausted
  expected:
    categories:
    - resource
    - dependency
    cause_files:
    - services/storefront-api/src/db.js
    cause_symbol: connect
    trace_files: []
    keywords:
    - - pool
    - - maxPoolSize
      - pool size
      - 2 connections
      - waitQueue
      - reduced
      - shrunk
      - trimmed
      - cut
      - smaller
      - small
    fix_checks:
    - added: maxPoolSize:\s*\d{2,}
    reference: The MongoDB connection pool was cut from 50 to 2 connections with a 500 ms wait limit, so under concurrent
      traffic the trending aggregation queues for a connection and times out.
    reference_fix:
    - file: services/storefront-api/src/db.js
      old: |2
            maxPoolSize: 2, // small hosts: keep the pool lean
            waitQueueTimeoutMS: 500,
            serverSelectionTimeoutMS: 5000,
      new: |2
            maxPoolSize: 50,
            serverSelectionTimeoutMS: 5000,
- id: bug-02-lowercase-sku
  title: Lower-case SKU reported unknown
  bug_id: 2
  fixture: bug-02-lowercase-sku
  service: storefront-api
  repo_ref: isolated/bug-02-lowercase-sku
  expected:
    categories: &id001
    - code_bug
    cause_files: &id002
    - services/storefront-api/src/pricing.js
    cause_symbol: priceCart
    trace_files: &id003
    - services/storefront-api/src/pricing.js
    keywords: &id004
    - - sku
    - - normal
      - upper
      - lower case
      - lowercase
      - case
    fix_checks: &id005
    - added: normalizeSku\(
    reference: The catalog lookup stopped normalising the SKU (trim and upper-case), so a SKU sent in lower case is reported
      as unknown.
    reference_fix: &id006
    - file: services/storefront-api/src/pricing.js
      old: |2
            const product = bySku.get(item.sku);
      new: |2
            const product = bySku.get(normalizeSku(item.sku));
- id: bug-03-missing-await
  title: Out-of-stock becomes an unhandled rejection
  bug_id: 3
  fixture: bug-03-missing-await
  service: storefront-api
  repo_ref: isolated/bug-03-missing-await
  expected:
    categories:
    - code_bug
    cause_files:
    - services/storefront-api/src/app.js
    cause_symbol: checkout
    trace_files:
    - services/storefront-api/src/clients.js
    keywords:
    - - await
    - - reserve
      - reservation
      - reserveStock
    fix_checks:
    - added: await\s+reserveStock
    reference: The stock reservation is no longer awaited and its error no longer handled, so an out-of-stock answer becomes
      an unhandled promise rejection while the order is charged anyway.
    reference_fix:
    - file: services/storefront-api/src/app.js
      old: |2
              // the reservation runs alongside the payment, so checkout is not slowed down by inventory
              reserveStock(orderId, priced.lines);
      new: |2
              try {
                await reserveStock(orderId, priced.lines);
              } catch (err) {
                if (err instanceof OutOfStockError) {
                  warn(`checkout refused: ${err.message}`);
                  return res.status(409).json({ error: err.message });
                }
                throw err;
              }
    - file: services/storefront-api/src/app.js
      old: import { charge, releaseStock, reserveStock } from "./clients.js";
      new: import { charge, OutOfStockError, releaseStock, reserveStock } from "./clients.js";
    - file: services/storefront-api/src/app.js
      old: import { error, info } from "./log0.js";
      new: import { error, info, warn } from "./log0.js";
- id: bug-04-nil-map
  title: Go nil-map panic on large orders
  bug_id: 4
  fixture: bug-04-nil-map
  service: payments
  repo_ref: isolated/bug-04-nil-map
  expected:
    categories:
    - code_bug
    cause_files:
    - services/payments/main.go
    - services/payments/store.go
    cause_symbol: main
    trace_files:
    - services/payments/store.go
    - services/payments/main.go
    keywords:
    - - nil map
      - nil-map
      - map
    - - Store
      - NewStore
      - initial
      - constructor
    fix_checks:
    - added: NewStore\(\)|make\(map\[string\]Result
    reference: The server is built with &Store{} instead of NewStore(), so the idempotency store's map is nil and the first
      write, for orders of 100 dollars or more, panics.
    reference_fix:
    - file: services/payments/main.go
      old: "\t\tstore:   &Store{},\n"
      new: "\t\tstore:   NewStore(),\n"
- id: bug-05-retry-storm
  title: Retry storm during a gateway outage
  bug_id: 5
  fixture: bug-05-retry-storm
  service: payments
  repo_ref: isolated/bug-05-retry-storm
  expected:
    categories:
    - dependency
    - resource
    - code_bug
    cause_files:
    - services/payments/main.go
    cause_symbol: main
    trace_files: []
    keywords:
    - - retry
      - retries
    - - backoff
      - immediately
      - no delay
      - attempts
      - storm
      - hammer
    fix_checks:
    - added: defaultRetry\(\)|base:\s*[1-9]
    reference: Production uses six immediate retries with no backoff, so during a gateway outage every charge hammers the
      gateway six times in a row.
    reference_fix:
    - file: services/payments/main.go
      old: "\t\tretry:   retryPolicy{attempts: 6, base: 0, sleep: time.Sleep},\n"
      new: "\t\tretry:   defaultRetry(),\n"
    - file: services/payments/main.go
      old: "\t\"strings\"\n\t\"time\"\n)"
      new: "\t\"strings\"\n)"
- id: bug-06-key-rotation
  title: 'Payments rejected: rotated key (not a code bug)'
  bug_id: 6
  fixture: bug-06-key-rotation
  service: payments
  repo_ref: isolated/bug-06-key-rotation
  expected:
    categories:
    - config
    - dependency
    cause_files: []
    secondary_files:
    - services/payments/gateway.go
    fixable_by_code: false
    trace_files: []
    keywords:
    - - key
      - credential
      - api key
    - - rotat
      - expired
      - outdated
      - config
      - environment
      - GATEWAY_API_KEY
      - not a code
      - outside
    fix_checks: []
    must_not_contain:
    - sk_live_demo_0123456789abcdef
    reference: The payment provider rotated its key and the one configured for the payments service is out of date, so every

asyncapi: 3.0.0

info:
  title: log0 Event API
  version: 1.0.0
  description: |
    AsyncAPI specification for all Kafka event contracts in the log0 platform.

    log0 is a multi-tenant log intelligence and incident management platform.
    Logs enter at the ingestion-gateway and flow through a linear pipeline:
    ingestion → normalization → clustering → incident management → notification.

    Every message is keyed by `tenantId` to guarantee per-tenant ordering
    within Kafka partitions. Each stage has a corresponding dead-letter queue
    (DLQ) topic so no event is silently lost on processing failure.
  contact:
    name: log0 Platform
    url: https://log0.vercel.app/docs

defaultContentType: application/json

servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Local Kafka broker started via docker-compose in docker/kafka/

# ---------------------------------------------------------------------------
# CHANNELS
# ---------------------------------------------------------------------------

channels:

  raw-logs:
    address: raw-logs
    description: |
      Receives every accepted log event from the ingestion-gateway.
      Kafka key = `tenantId` (ensures per-tenant ordering within partitions).
      On producer failure the event is routed to `raw-logs-dlq` instead.
    messages:
      RawLogEvent:
        $ref: '#/components/messages/RawLogEvent'

  raw-logs-dlq:
    address: raw-logs-dlq
    description: |
      Dead-letter queue for the `raw-logs` pipeline. Receives events that
      could not be delivered or processed by the normalization-service.
      Kafka key = `eventId` of the original failed event.
      Multiple services publish here: ingestion-gateway (producer failure)
      and normalization-service (consumer processing failure).
    messages:
      DlqEvent:
        $ref: '#/components/messages/DlqEvent'

  normalized-logs:
    address: normalized-logs
    description: |
      Carries fully normalized and fingerprinted log events produced by
      the normalization-service. Kafka key = `tenantId`.
      On consumer failure in the clustering-service the event is routed
      to `raw-logs-dlq`.
    messages:
      NormalizedLogEvent:
        $ref: '#/components/messages/NormalizedLogEvent'

  incident-events:
    address: incident-events
    description: |
      Published by the clustering-service when a fingerprint's occurrence
      count crosses the configured threshold within a 5-minute tumbling window.
      Kafka key = `tenantId`.
      Consumed by the incident-service to create or update incidents in PostgreSQL.
    messages:
      IncidentEvent:
        $ref: '#/components/messages/IncidentEvent'

  notification-events:
    address: notification-events
    description: |
      Published by the incident-service on incident lifecycle transitions
      (CREATED, ASSIGNED, RESOLVED). Kafka key = `tenantId`.
      Consumed by the notification-service to send Slack alerts.
    messages:
      NotificationEvent:
        $ref: '#/components/messages/NotificationEvent'

# ---------------------------------------------------------------------------
# OPERATIONS - who sends/receives on each channel
# ---------------------------------------------------------------------------

operations:

  ingestion-gateway/publishRawLog:
    action: send
    channel:
      $ref: '#/channels/raw-logs'
    summary: Publish a raw log event after validation
    description: |
      Called by the ingestion-gateway after a POST /api/v1/logs request passes
      header and payload validation. The event is sent asynchronously; HTTP 202
      is returned to the client immediately.

  ingestion-gateway/publishRawLogDlq:
    action: send
    channel:
      $ref: '#/channels/raw-logs-dlq'
    summary: Route failed raw log events to the DLQ
    description: |
      Published by the ingestion-gateway when the Kafka send to `raw-logs` fails.

  normalization-service/consumeRawLog:
    action: receive
    channel:
      $ref: '#/channels/raw-logs'
    summary: Consume raw log events for normalization
    description: |
      Manual offset acknowledgment - the offset is committed only after the
      normalized event is successfully published to `normalized-logs`.
      On failure the event is forwarded to `raw-logs-dlq` and the offset is
      still committed to prevent partition stalls.

  normalization-service/publishNormalizedLog:
    action: send
    channel:
      $ref: '#/channels/normalized-logs'
    summary: Publish a normalized and fingerprinted log event

  normalization-service/publishNormalizedLogDlq:
    action: send
    channel:
      $ref: '#/channels/raw-logs-dlq'
    summary: Route normalization failures to the DLQ

  clustering-service/consumeNormalizedLog:
    action: receive
    channel:
      $ref: '#/channels/normalized-logs'
    summary: Consume normalized log events for fingerprint-based clustering
    description: |
      Groups events by (tenantId + fingerprint) within a configurable tumbling
      window (default 5 minutes). When occurrence count reaches the configured
      threshold (default 10) an IncidentEvent is published.

  clustering-service/publishIncidentEvent:
    action: send
    channel:
      $ref: '#/channels/incident-events'
    summary: Publish an incident event when the occurrence threshold is crossed

  clustering-service/publishClusteringDlq:
    action: send
    channel:
      $ref: '#/channels/raw-logs-dlq'
    summary: Route clustering failures to the DLQ

  incident-service/consumeIncidentEvent:
    action: receive
    channel:
      $ref: '#/channels/incident-events'
    summary: Consume incident events to create or update incidents in PostgreSQL
    description: |
      Deduplicates by (tenantId + fingerprint) where status != RESOLVED.
      On new incident: triggers async AI summarization and publishes a
      NotificationEvent. On update: increments occurrence count only.

  incident-service/publishNotificationEvent:
    action: send
    channel:
      $ref: '#/channels/notification-events'
    summary: Publish a notification event on incident lifecycle transitions

  incident-service/publishIncidentDlq:
    action: send
    channel:
      $ref: '#/channels/raw-logs-dlq'
    summary: Route incident processing failures to the DLQ

  notification-service/consumeNotificationEvent:
    action: receive
    channel:
      $ref: '#/channels/notification-events'
    summary: Consume notification events and send Slack alerts
    description: |
      Posts formatted Slack Block Kit messages to the configured channel.
      On failure routes to `notification-events-dlq` (internal DLQ topic).

# ---------------------------------------------------------------------------
# COMPONENTS - reusable message and schema definitions
# ---------------------------------------------------------------------------

components:

  messages:

    RawLogEvent:
      name: RawLogEvent
      title: Raw Log Event
      summary: A validated log event as received by the ingestion-gateway
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RawLogEvent'

    NormalizedLogEvent:
      name: NormalizedLogEvent
      title: Normalized Log Event
      summary: A log event after normalization and SHA-256 fingerprinting
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NormalizedLogEvent'

    IncidentEvent:
      name: IncidentEvent
      title: Incident Event
      summary: Signals that a fingerprint's occurrence count crossed the threshold
      contentType: application/json
      payload:
        $ref: '#/components/schemas/IncidentEvent'

    NotificationEvent:
      name: NotificationEvent
      title: Notification Event
      summary: Signals an incident lifecycle transition requiring a Slack alert
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NotificationEvent'

    DlqEvent:
      name: DlqEvent
      title: Dead-Letter Queue Event
      summary: Wraps any failed event with error context for replay or alerting
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DlqEvent'

  schemas:

    RawLogEvent:
      type: object
      description: |
        Published to `raw-logs` by the ingestion-gateway immediately after a
        POST /api/v1/logs request passes validation. Carries the original log
        payload enriched with platform metadata (eventId, receivedAt).
      required:
        - eventId
        - tenantId
        - serviceName
        - environment
        - receivedAt
        - level
        - message
      properties:
        eventId:
          type: string
          format: uuid
          description: Platform-assigned unique identifier for this log event (UUID v4)
          example: "a3f2c1d4-55b6-4e89-9f12-0a1b2c3d4e5f"
        tenantId:
          type: string
          format: uuid
          description: Tenant that owns this log event. Also used as the Kafka partition key.
          example: "b7e1f290-12ab-4cd3-8ef5-6789abcd0123"
        serviceName:
          type: string
          description: Name of the application service that generated the log
          example: "payment-service"
        environment:
          type: string
          description: Deployment environment (e.g. production, staging, dev)
          example: "production"
        receivedAt:
          type: string
          format: date-time
          description: UTC timestamp when the ingestion-gateway received the request
          example: "2026-03-30T10:15:30Z"
        logTimestamp:
          type: string
          format: date-time
          description: |
            UTC timestamp from the original log payload. Null if not provided -
            the normalization-service falls back to `receivedAt` in that case.
          example: "2026-03-30T10:15:29.842Z"
        level:
          type: string
          description: Raw log level string as sent by the client (normalized downstream)
          example: "ERROR"
        message:
          type: string
          maxLength: 10000
          description: The log message body
          example: "Connection timeout after 30000ms calling payment gateway"
        trace:
          type: string
          maxLength: 100000
          description: Optional stack trace or structured trace context
          example: "java.net.SocketTimeoutException: Read timed out\n\tat com.example..."

    NormalizedLogEvent:
      type: object
      description: |
        Published to `normalized-logs` by the normalization-service after
        cleaning the raw event and generating a deterministic SHA-256 fingerprint.
        The fingerprint is the deduplication key used by the clustering-service.
      required:
        - eventId
        - tenantId
        - serviceName
        - environment
        - timestamp
        - level
        - message
        - messageTemplate
        - fingerprint
        - schemaVersion
      properties:
        eventId:
          type: string
          format: uuid
          description: Carried through from RawLogEvent for end-to-end tracing
          example: "a3f2c1d4-55b6-4e89-9f12-0a1b2c3d4e5f"
        tenantId:
          type: string
          format: uuid
          description: Tenant that owns this event. Kafka partition key.
          example: "b7e1f290-12ab-4cd3-8ef5-6789abcd0123"
        serviceName:
          type: string
          example: "payment-service"
        environment:
          type: string
          example: "production"
        timestamp:
          type: string
          format: date-time
          description: |
            Resolved timestamp: logTimestamp from the raw event if present,
            otherwise falls back to receivedAt.
          example: "2026-03-30T10:15:29.842Z"
        level:
          type: string
          description: Normalized log level (uppercased; defaults to INFO if unrecognized)
          example: "ERROR"
        message:
          type: string
          description: Trimmed, null-safe log message
          example: "Connection timeout after 30000ms calling payment gateway"
        messageTemplate:
          type: string
          description: |
            Dynamic values replaced by tokens in strict order:
            UUIDs → <uuid>, IPs → <ip>, numbers → <number>.
            Used as the stable input to fingerprint hashing.
          example: "Connection timeout after <number>ms calling payment gateway"
        fingerprint:
          type: string
          description: |
            SHA-256 hex digest of: serviceName|messageTemplate|exceptionType|firstStackFrame.
            Deterministic across deployments - same error always produces the same fingerprint.
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        attributes:
          type: object
          description: Extracted structured attributes (placeholder - reserved for future enrichment)
          additionalProperties: true
          example: {}
        traceId:
          type: string
          description: Optional distributed trace ID for correlation with APM tools
          example: "4bf92f3577b34da6a3ce929d0e0e4736"
        schemaVersion:
          type: string
          description: Schema version for forward compatibility. Currently always "v1".
          example: "v1"

    IncidentEvent:
      type: object
      description: |
        Published to `incident-events` by the clustering-service when a
        (tenantId + fingerprint) combination exceeds the occurrence threshold
        within a tumbling window. Triggers incident creation or update in PostgreSQL.
      required:
        - tenantId
        - fingerprint
        - serviceName
        - environment
        - severity
        - occurrenceCount
        - firstSeenAt
        - lastSeenAt
        - topMessages
      properties:
        tenantId:
          type: string
          format: uuid
          description: Tenant that owns this incident. Kafka partition key.
          example: "b7e1f290-12ab-4cd3-8ef5-6789abcd0123"
        fingerprint:
          type: string
          description: SHA-256 fingerprint from NormalizedLogEvent. Deduplication key.
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        serviceName:
          type: string
          example: "payment-service"
        environment:
          type: string
          example: "production"
        severity:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          description: |
            Resolved by SeverityResolver: ERROR/FATAL → HIGH, WARN → MEDIUM, INFO/DEBUG → LOW
          example: "HIGH"
        occurrenceCount:
          type: integer
          format: int64
          description: Number of matching log events seen within the current window
          example: 438
        firstSeenAt:
          type: string
          format: date-time
          description: Timestamp of the first log event in the current clustering window
          example: "2026-03-30T10:10:00Z"
        lastSeenAt:
          type: string
          format: date-time
          description: Timestamp of the most recent log event in the current window
          example: "2026-03-30T10:15:00Z"
        topMessages:
          type: array
          items:
            type: string
          description: Up to 10 distinct log messages from this window (for AI prompt context)
          example:
            - "Connection timeout after 30000ms calling payment gateway"
            - "Connection timeout after 28514ms calling payment gateway"

    NotificationEvent:
      type: object
      description: |
        Published to `notification-events` by the incident-service on incident
        lifecycle transitions. The notification-service consumes this to send
        formatted Slack Block Kit alerts.
      required:
        - tenantId
        - incidentId
        - fingerprint
        - serviceName
        - environment
        - severity
        - status
        - occurrenceCount
        - firstSeenAt
        - lastSeenAt
        - topMessages
        - notificationType
      properties:
        tenantId:
          type: string
          format: uuid
          description: Tenant that owns this incident. Kafka partition key.
          example: "b7e1f290-12ab-4cd3-8ef5-6789abcd0123"
        incidentId:
          type: string
          format: uuid
          description: Database ID of the incident in PostgreSQL
          example: "c9d8e7f6-a5b4-4c3d-2e1f-0a9b8c7d6e5f"
        fingerprint:
          type: string
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        serviceName:
          type: string
          example: "payment-service"
        environment:
          type: string
          example: "production"
        severity:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          example: "HIGH"
        status:
          type: string
          enum: [NEW, ASSIGNED, ACKNOWLEDGED, RESOLVED]
          description: Current incident status at the time of the notification
          example: "NEW"
        occurrenceCount:
          type: integer
          format: int64
          example: 438
        firstSeenAt:
          type: string
          format: date-time
          example: "2026-03-30T10:10:00Z"
        lastSeenAt:
          type: string
          format: date-time
          example: "2026-03-30T10:15:00Z"
        topMessages:
          type: array
          items:
            type: string
          example:
            - "Connection timeout after 30000ms calling payment gateway"
        aiSummary:
          type: string
          description: |
            AI-generated incident summary from the ai-service. Null on INCIDENT_CREATED
            (async - may arrive shortly after). Present on subsequent events.
          example: "Summary: Payment gateway timeouts causing checkout failures.\nPossible Cause: Upstream latency spike..."
        notificationType:
          type: string
          enum: [INCIDENT_CREATED, INCIDENT_ASSIGNED, INCIDENT_RESOLVED]
          description: The lifecycle event that triggered this notification
          example: "INCIDENT_CREATED"
        assignedToUserId:
          type: string
          format: uuid
          description: |
            UUID of the engineer assigned to this incident.
            Null unless notificationType is INCIDENT_ASSIGNED.
          example: "d1e2f3a4-b5c6-7d8e-9f0a-1b2c3d4e5f6a"

    DlqEvent:
      type: object
      description: |
        Universal dead-letter queue envelope. Published to `raw-logs-dlq` by any
        service that catches a processing error. Preserves the original event and
        error context for replay or alerting without losing data.
      required:
        - originalEvent
        - errorMessage
        - failedAt
        - failedAtTs
      properties:
        originalEvent:
          description: |
            The original event payload that could not be processed.
            Type varies by which service published to the DLQ:
            RawLogEvent (ingestion-gateway), NormalizedLogEvent (normalization-service),
            IncidentEvent (clustering-service), NotificationEvent (incident-service).
          example: {}
        errorMessage:
          type: string
          description: Exception message or cause of failure
          example: "org.apache.kafka.common.errors.TimeoutException: Topic raw-logs not present"
        failedAt:
          type: string
          description: Name of the service that caught the error and published this DLQ event
          enum:
            - ingestion-gateway
            - normalization-service
            - clustering-service
            - incident-service
            - notification-service
          example: "normalization-service"
        failedAtTs:
          type: string
          format: date-time
          description: UTC timestamp when the failure was caught
          example: "2026-03-30T10:15:31Z"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ingestion-gateway
          - normalization-service
          - clustering-service
          - incident-service
          - notification-service
          - auth-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp verify

  ai-service:
    # The AI service is Python (uv, ruff, pytest), not Maven. Tests that need Postgres or ClickHouse skip themselves
    # here (SKIP_INTEGRATION_TESTS); the full suite, with the docker stack, runs locally and in the evaluation workflow.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    env:
      SKIP_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep git
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/ai-service/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check app tests evals
      - run: uv run pytest -q -p no:cacheprovider
